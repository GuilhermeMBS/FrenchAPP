<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuilhermeMBS - Francês</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Treino de Francês</h1>

        <div id="file-section" class="card">
            <!-- Menu Principal -->
            <div id="main-menu">
                <div class="option-group">
                    <label for="list-select">Escolha uma lista pré-carregada:</label>
                    <select id="list-select">
                        <option value="">-- Selecione uma lista --</option>
                        <option value="adverbes">Advérbios de Frequência & Tempo</option>
                        <option value="connecteurs_a1_b1_phrases">Aplicação dos Conectores de Frases (A1 a B1)</option>
                        <option value="connecteurs">Conectores de Frases (Teste)</option>
                        <option value="connecteurs_a1_b1">Conectores de Frases (A1 a B1)</option>
                        <option value="frequence_1">Verbos - Nível Essencial</option>
                    </select>
                </div>

                <div class="divider">ou</div>

                <div class="option-group">
                    <label for="file-input">Carregue seu arquivo .txt (frente [TAB] verso [ENTER]):</label>
                    <input type="file" id="file-input" accept=".txt,.tsv,.csv">
                </div>
                
                <div class="divider">delf b1</div>
                
                <button type="button" id="btn-delf-b1">Estudo de Production Écrite</button>
            </div>

            <!-- Menu DELF B1 (Oculto por padrão) -->
            <div id="delf-b1-menu" class="hidden">
                <h2 class="delf-title">Production Écrite</h2>
                
                <!-- Seletor de Formalidade -->
                <div class="formality-toggle">
                    <label class="radio-label">
                        <input type="radio" name="register" value="informal" checked>
                        Informal (Tu)
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="register" value="formal">
                        Formal (Vous)
                    </label>
                </div>

                <div class="delf-b1-buttons">
                    <button type="button" class="btn-delf" data-list="core-grammar" data-title="Gramática (Estruturas)">Gramática (Estruturas)</button>
                    <button type="button" class="btn-delf" data-list="core-connectors" data-title="Conectivos (Lógica)">Conectivos (Lógica)</button>
                    <button type="button" class="btn-delf" data-list="format-email" data-title="Formato E-mail">Formato E-mail</button>
                    <button type="button" class="btn-delf" data-list="format-letter" data-title="Formato Carta">Formato Carta</button>
                    <button type="button" class="btn-delf" data-list="format-forum" data-title="Formato Fórum">Formato Fórum</button>
                </div>
                <button type="button" id="btn-back-main" class="btn-secondary">← Voltar ao Menu Principal</button>
            </div>
        </div>

        <div id="quiz-section" class="card hidden">
            <div class="header-nav">
                <button type="button" id="btn-home" class="btn-secondary">← Voltar</button>
                <div class="stats">
                    Restantes na fila: <strong id="cards-left">0</strong>
                </div>
            </div>

            <!-- Título Dinâmico da Lista Atual -->
            <div id="quiz-header" class="hidden">
                <h2 id="quiz-title">Título</h2>
                <h3 id="quiz-subtitle">Subtítulo</h3>
            </div>

            <div class="prompt-box">
                <span id="prompt-text">Carregando...</span>
            </div>

            <form id="quiz-form">
                <div class="input-container">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Digite ou fale em francês..." 
                        autocomplete="off" 
                        autocorrect="off" 
                        autocapitalize="off" 
                        spellcheck="false"
                    >
                    <button type="button" id="btn-mic" title="Falar em francês">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="22"></line>
                        </svg>
                    </button>
                </div>
                <button type="submit" id="btn-submit">Checar</button>
            </form>

            <div id="feedback" class="feedback-box hidden">
                <div id="feedback-text"></div>
                <div class="feedback-buttons">
                    <button type="button" id="btn-override" class="hidden">Forçar Acerto</button>
                    <button type="button" id="btn-next" class="btn-advance">Avançar</button>
                </div>
            </div>

            <div id="completion-box" class="hidden">
                <p>🎉 Félicitations! Você completou todos os cards desta lista!</p>
                <button id="btn-restart" type="button">Voltar ao Início</button>
            </div>
        </div>
    </div>

    <!-- Listas Padrão -->
    <script src="lists/adverbes.js"></script>
    <script src="lists/connecteurs.js"></script>
    <script src="lists/connecteursA1B1.js"></script>
    <script src="lists/connecteursA1B1phrases.js"></script>
    <script src="lists/frequence_1.js"></script>

    <!-- Listas DELF B1 -->
    <script src="delf-b1/conectivos.js"></script>
    <script src="delf-b1/formato_email.js"></script>
    <script src="delf-b1/gramatica.js"></script>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
